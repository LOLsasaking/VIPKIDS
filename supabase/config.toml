project_id = "vipkids-transportation"

[auth]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_confirmations = true
double_confirm_changes = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.api]
# The API contains public access-request and account-deletion endpoints and
# performs explicit token verification for every protected route.
verify_jwt = false

[functions.routing]
verify_jwt = true

[functions.process-notifications]
verify_jwt = false

[functions.purge-expired-data]
verify_jwt = false
